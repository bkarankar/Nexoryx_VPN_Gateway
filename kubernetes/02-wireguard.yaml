apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: nexoryx-vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
      - name: wireguard
        image: linuxserver/wireguard
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
        env:
        - name: PEERS
          value: "5"
        - name: SERVERURL
          value: vpn.example.com
        - name: SERVERPORT
          value: "51820"
        ports:
        - containerPort: 51820
          protocol: UDP
        readinessProbe:
          tcpSocket:
            port: 51820
          initialDelaySeconds: 20
        livenessProbe:
          tcpSocket:
            port: 51820
          initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: nexoryx-vpn
spec:
  selector:
    app: wireguard
  ports:
  - port: 51820
    protocol: UDP
